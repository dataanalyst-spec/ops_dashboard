<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Dashboard</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17262b;--mute:#60727a;--line:#d5dcdf;--accent:#0f6b6e;--ok:#cfe3f7;--warn:#f4c7cb;--mid:#dcd3ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:600}
.src{display:flex;gap:8px;align-items:center;font-size:13px}
button,select,input[type=file]{font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
button.ghost{background:transparent;border:1px solid #6b8088}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);background:var(--card)}
nav button{background:none;color:var(--mute);border-radius:4px 4px 0 0;padding:9px 14px;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:12px;padding:12px 20px;align-items:end}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:4px;min-width:110px;background:#fff}
main{padding:0 20px 30px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 18px;min-width:150px}
.kpi b{display:block;font-size:28px;font-weight:600}
.kpi span{color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:16px}
.wrap{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
th{background:#eef2f3;position:sticky;top:0;z-index:1}
tfoot td{font-weight:700;background:#eef2f3;position:sticky;bottom:0}
td.n{text-align:right}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.msg{padding:30px;text-align:center;color:var(--mute)}
.err{color:#a3262f}
.pend{color:#a3262f;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Operations Dashboard</h1>
  <div class="src">
    <span id="status">Not loaded</span>
    <button id="reload">Reload from Google Sheet</button>
    <label class="ghost" style="cursor:pointer;border:1px solid #6b8088;border-radius:4px;padding:5px 10px">Upload CSV<input id="file" type="file" accept=".csv" hidden></label>
  </div>
</header>
<nav id="tabs"></nav>
<div class="filters" id="filters"></div>
<main id="view"><div class="msg">Loading…</div></main>

<script>
/* ---------- CONFIG: edit these ---------- */
const SHEET_ID = "1y9EyD4WkiJMwZvOu9K0gIn4ZvCuA3jbVI9EnpGAtnpU";
const GID = "1582878707";            // the Master tab
const GROUP_JAYANTA = ["abhivritti","meera","samshrusti","kirti","camikara","ikshana"];
// Match each tab to the values in your "Task name" column (case-insensitive, "contains")
const TASKS = [
  {id:"ops",  label:"Daily Ops Report (Expenses)", match:["daily ops","expen"]},
  {id:"round",label:"Daily Property Round",        match:["property round"]},
  {id:"area", label:"Area Manager Report",         match:["area manager"]},
  {id:"om",   label:"Daily Task – Operation Managers", match:["operation manager"]}
];
/* ---------------------------------------- */

const $ = s => document.querySelector(s);
let rows=[], cols=[], M={}, tab="fill", F={year:"",month:"",day:"",property:"",status:""};

const opManager = p => GROUP_JAYANTA.includes((p||"").trim().toLowerCase()) ? "Jayanta" : "Arindam";

function parseCSV(t){
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"){r.push(c);out.push(r);r=[];c=""}
    else if(ch!="\r") c+=ch;
  }
  if(c||r.length){r.push(c);out.push(r)}
  return out;
}
function parseDate(s){
  s=(s||"").trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return {y:+m[1],m:+m[2],d:+m[3]};
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let a=+m[1],b=+m[2],y=+m[3]; if(y<100)y+=2000;
    return b>12?{y,m:a,d:b}:{y,m:b,d:a}}   // default dd/mm/yyyy
  const d=new Date(s); return isNaN(d)?null:{y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};
}
function load(text){
  const t=parseCSV(text).filter(r=>r.some(x=>x.trim()));
  cols=t[0].map(h=>h.trim()); 
  const find=re=>cols.findIndex(h=>re.test(h));
  M={task:find(/task\s*name/i), prop:find(/^property$|name of the property/i),
     date:find(/date|timestamp|submitted|created (at|on)/i), status:find(/status/i),
     y:find(/^year$/i), mo:find(/^month$/i), d:find(/^day$/i)};
  if(M.task<0||M.prop<0){fail("Couldn't find 'Task name' and 'Property' columns. Found: "+cols.join(", "));return}
  rows=t.slice(1).map(r=>{
    const o={v:r, prop:(r[M.prop]||"").trim(), task:(r[M.task]||"").toLowerCase()};
    let dt=M.date>=0?parseDate(r[M.date]):null;
    if(!dt&&M.y>=0) dt={y:+r[M.y],m:+r[M.mo],d:+r[M.d]};
    o.y=dt?dt.y:0;o.m=dt?dt.m:0;o.d=dt?dt.d:0;
    o.status=M.status>=0?(r[M.status]||"").trim():"";
    o.tid=(TASKS.find(k=>k.match.some(x=>o.task.includes(x)))||{}).id||"";
    return o}).filter(o=>o.prop);
  const latest=rows.filter(o=>o.y).sort((a,b)=>b.y*1e4+b.m*100+b.d-(a.y*1e4+a.m*100+a.d))[0];
  if(latest){F.year=String(latest.y);F.month=String(latest.m)}
  $("#status").textContent=rows.length+" rows loaded";
  render();
}
function fail(msg){$("#view").innerHTML='<div class="msg err">'+msg+'</div>';$("#status").textContent="Load failed"}
async function fetchSheet(){
  $("#status").textContent="Loading…";
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`);
    if(!r.ok) throw 0;
    load(await r.text());
  }catch(e){
    fail("Couldn't read the Google Sheet. In Sheets: Share → General access → <b>Anyone with the link (Viewer)</b>, then click Reload. Or use <b>File → Download → CSV</b> on the Master tab and click Upload CSV above.");
  }
}

const uniq=(a)=>[...new Set(a)].filter(x=>x!==""&&x!=="0").sort((x,y)=>isNaN(x)||isNaN(y)?String(x).localeCompare(y):x-y);
function filtered(tid){
  return rows.filter(o=>(!tid||o.tid===tid)&&(!F.year||o.y==F.year)&&(!F.month||o.m==F.month)&&(!F.day||o.d==F.day)
    &&(!F.property||o.prop===F.property)&&(!F.status||o.status===F.status));
}
function renderFilters(){
  const opt=(k,vals)=>`<label>${k[0].toUpperCase()+k.slice(1)}<select data-k="${k}"><option value="">All</option>${vals.map(v=>`<option ${F[k]==v?"selected":""}>${v}</option>`).join("")}</select></label>`;
  $("#filters").innerHTML=opt("year",uniq(rows.map(o=>o.y)))+opt("month",uniq(rows.map(o=>o.m)))+opt("day",uniq(rows.map(o=>o.d)))
    +opt("property",uniq(rows.map(o=>o.prop)))+opt("status",uniq(rows.map(o=>o.status)));
  document.querySelectorAll("#filters select").forEach(s=>s.onchange=()=>{F[s.dataset.k]=s.value;render()});
}
function renderTabs(){
  const all=[{id:"fill",label:"Filling Rate"},...TASKS];
  $("#tabs").innerHTML=all.map(t=>`<button class="${tab===t.id?"on":""}" data-t="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}

function taskView(tid){
  const data=filtered(tid);
  const allProps=uniq(rows.map(o=>o.prop));
  const filledSet=new Set(data.map(o=>o.prop));
  const pending=allProps.filter(p=>!filledSet.has(p));
  // columns that actually have data for this task
  const skip=new Set([M.task,M.prop,M.date,M.y,M.mo,M.d,M.status]);
  const show=cols.map((c,i)=>i).filter(i=>c(i)&&data.some(o=>(o.v[i]||"").trim()!==""));
  function c(i){return !skip.has(i)}
  const sums=show.map(i=>{const nums=data.map(o=>(o.v[i]||"").trim()).filter(x=>x!=="");
    return nums.length&&nums.every(x=>!isNaN(x.replace(/,/g,"")))?nums.reduce((a,x)=>a+ +x.replace(/,/g,""),0):null});
  const head="<tr><th>Property</th><th>Date</th>"+show.map(i=>`<th>${cols[i]}</th>`).join("")+"</tr>";
  const body=data.map(o=>`<tr><td>${o.prop}</td><td>${o.d?o.d+"/"+o.m+"/"+o.y:""}</td>`+show.map(i=>{
    const v=(o.v[i]||"").trim();return `<td class="${v!==""&&!isNaN(v)?"n":""}" title="${v.replace(/"/g,"&quot;")}">${v}</td>`}).join("")+"</tr>").join("");
  const foot=sums.some(s=>s!==null)?"<tr><td>Total</td><td></td>"+sums.map(s=>`<td class="n">${s===null?"":Math.round(s*100)/100}</td>`).join("")+"</tr>":"";
  return `<div class="kpis"><div class="kpi"><b>${filledSet.size}</b><span>Filled properties</span></div>
    <div class="kpi"><b>${pending.length}</b><span>Pending properties</span></div>
    <div class="kpi"><b>${data.length}</b><span>Submissions</span></div></div>
    ${pending.length?`<div class="card"><h2>Pending</h2><span class="pend">${pending.join(", ")}</span></div>`:""}
    <div class="card"><h2>${TASKS.find(t=>t.id===tid).label}</h2><div class="wrap"><table><thead>${head}</thead><tbody>${body||'<tr><td colspan="9">No rows for these filters</td></tr>'}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div></div>`;
}

/* Filling rate: distinct days filled / days in that week of the month (up to today) */
function fillTable(tid,groupBy){
  const y=+F.year,m=+F.month; if(!y||!m) return '<div class="msg">Select a Year and Month</div>';
  const dim=new Date(y,m,0).getDate(), now=new Date();
  const last=(now.getFullYear()==y&&now.getMonth()+1==m)?now.getDate():dim;
  const wk=d=>Math.min(5,Math.ceil(d/7));
  const expected=[0,0,0,0,0];for(let d=1;d<=last;d++)expected[wk(d)-1]++;
  const data=rows.filter(o=>o.tid===tid&&o.y==y&&o.m==m);
  const keyOf=groupBy==="prop"?(p=>p):opManager;
  const groups=uniq(rows.map(o=>keyOf(o.prop)));
  const props=groupBy==="prop"?null:uniq(rows.map(o=>o.prop));
  const rate=(g,w)=>{ if(!expected[w])return null;
    const set=new Set(data.filter(o=>keyOf(o.prop)===g&&wk(o.d)==w+1).map(o=>o.prop+"|"+o.d));
    const n=groupBy==="prop"?1:props.filter(p=>keyOf(p)===g).length;
    return Math.min(1,set.size/(expected[w]*n))};
  const tot=g=>{const e=expected.reduce((a,b)=>a+b,0);const n=groupBy==="prop"?1:props.filter(p=>keyOf(p)===g).length;
    const s=new Set(data.filter(o=>keyOf(o.prop)===g).map(o=>o.prop+"|"+o.d));return e?Math.min(1,s.size/(e*n)):null};
  const cell=v=>v===null?"<td></td>":`<td style="background:${v>=1?"var(--ok)":v>=.8?"var(--mid)":"var(--warn)"}">${(v*100).toFixed(2)}%</td>`;
  const lines=groups.map(g=>({g,w:[0,1,2,3,4].map(i=>rate(g,i)),t:tot(g)})).sort((a,b)=>(a.t??0)-(b.t??0));
  return `<div class="wrap"><table><thead><tr><th>${groupBy==="prop"?"Property":"Operation Manager"}</th>${[1,2,3,4,5].map(i=>`<th>Week -${i}</th>`).join("")}<th>Total</th></tr></thead><tbody>`
    +lines.map(l=>`<tr><td>${l.g}</td>${l.w.map(cell).join("")}${cell(l.t)}</tr>`).join("")+"</tbody></table></div>";
}
function fillView(){
  const parts=TASKS.filter(t=>t.id!=="om").map(t=>`<div class="card"><h2>${t.label} – Filling Rate</h2>${fillTable(t.id,"prop")}<h2 style="margin-top:14px">By Operation Manager</h2>${fillTable(t.id,"om")}</div>`);
  return `<div class="g">${parts.join("")}</div><div class="card"><h2>Notes</h2><span style="color:var(--mute)">Week 1 = days 1–7 of the month, and so on. Rate = days a property submitted ÷ days elapsed in that week. Blue = 100%, purple = 80%+, pink = below 80%.</span></div>`;
}

function render(){
  if(!rows.length) return;
  renderTabs();renderFilters();
  $("#view").innerHTML=tab==="fill"?fillView():taskView(tab);
}
$("#reload").onclick=fetchSheet;
$("#file").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(load)};
fetchSheet();
</script>
</body>
</html>
